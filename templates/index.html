<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Biblioteca Fácil</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <h1>Biblioteca Fácil</h1>

    <p>Sistema de gerenciamento de livros.</p>

    <hr>

    <h2>Cadastrar livro</h2>

    <form action="/cadastrar" method="POST">

        <label>Título:</label><br>
        <input type="text" name="titulo" required>

        <br><br>

        <label>Autor:</label><br>
        <input type="text" name="autor" required>

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <hr>

    <h2>Livros cadastrados</h2>

    {% if livros %}

        <ul>
            {% for livro in livros %}
                <li>{{ livro[1] }} - {{ livro[2] }}</li>
            {% endfor %}
        </ul>

    {% else %}

        <p>Nenhum livro cadastrado.</p>

    {% endif %}

</body>

</html>
